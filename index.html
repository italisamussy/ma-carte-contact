<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bufalitaly - Contact</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f7;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            padding: 30px;
            text-align: center;
        }
        .logo-container img {
            width: 120px;
            height: auto;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 24px;
            margin: 10px 0 5px 0;
            color: #111;
        }
        p {
            font-size: 16px;
            color: #666;
            margin: 0 0 25px 0;
        }
        .qr-container {
            background-color: #fafafa;
            border: 1px dashed #e1e1e6;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            display: inline-block;
        }
        .qr-container img {
            width: 200px;
            height: 200px;
            display: block;
            margin: 0 auto;
        }
        .btn {
            display: block;
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: background-color 0.2s ease;
        }
        .btn:hover {
            background-color: #222222;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-container">
            <img src="bufalitaly-tondo-sito.png" alt="Logo Bufalitaly">
        </div>

        <h1>Bufalitaly</h1>
        <p>Scannez ou enregistrez ma carte contact</p>

        <div class="qr-container">
            <img src="qr-code-mini-site.png" alt="QR Code Bufalitaly">
        </div>

        <a href="logo.png" class="btn" download="vcard-bufalitaly">
            Enregistrer le contact
        </a>
    </div>

</body>
</html>
