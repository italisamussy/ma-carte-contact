<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isabelle MUSSY - Carte Contact</title>
    
    <script>
        // Si le scan provient de l'ancienne configuration de redirection,
        // le code force immédiatement l'affichage de votre vraie carte Vercel.
        if (window.location.search.includes("qr") || document.referrer.includes("qr") || window.location.href.includes("monkey")) {
            window.location.href = "https://ma-carte-contact.vercel.app/";
        }
    </script>

    <style>
        /* --- FOND NOIR --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0b0c; 
            color: #ffffff; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        /* --- GUIRLANDE SUBTILE VERT / BLANC / ROUGE --- */
        .guirlande {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle, rgba(0, 146, 70, 0.4) 1.5px, transparent 1.5px),  
                radial-gradient(circle, rgba(255, 255, 255, 0.3) 1.5px, transparent 1.5px),
                radial-gradient(circle, rgba(206, 43, 55, 0.4) 1.5px, transparent 1.5px); 
            background-size: 40px 40px, 60px 60px, 50px 50px;
            background-position: 0 0, 20px 20px, 10px 30px;
            opacity: 0.25;
            z-index: 1;
            pointer-events: none;
        }

        .card {
            background: #16161a; 
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 380px;
            padding: 30px;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        
        /* --- ALIGNEMENT DES DEUX MARQUES --- */
        .logo-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .logo-container img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }

        /* --- IDENTITÉ & TEXTES --- */
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 5px 0;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 15px;
            color: #bdc3c7;
            margin: 0 0 5px 0;
            font-weight: 500;
        }

        .description {
            font-size: 14px;
            color: #8e8e93;
            margin: 0 0 20px 0;
            font-style: italic;
        }

        /* --- FINE GUIRLANDE DE SÉPARATION --- */
        .separator-line {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 0 auto 25px auto;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        .dot-v { background-color: #009246; }
        .dot-w { background-color: #ffffff; }
        .dot-r { background-color: #ce2b37; }

        /* --- BOUTONS D'APPEL DIRECT --- */
        .action-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 15px;
            margin-bottom: 12px;
            transition: background 0.2s;
        }

        .action-link:active {
            background: rgba(255, 255, 255, 0.15);
        }

        /* --- BLOC BLANC DU QR CODE --- */
        .qr-container {
            background-color: #ffffff; 
            border-radius: 18px;
            padding: 15px;
            margin: 25px 0;
            display: inline-block;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .qr-container img {
            width: 190px;
            height: 190px;
            display: block;
            margin: 0 auto;
        }

        /* --- BOUTON ENREGISTREMENT --- */
        .btn-submit {
            display: block;
            background-color: #ffffff; 
            color: #000000;
            text-decoration: none;
            padding: 16px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 16px;
            border: none;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        }

        .btn-submit:active {
            background-color: #e5e5ea;
        }
    </style>
</head>
<body>

    <div class="guirlande"></div>

    <div class="card">
        <div class="logo-container">
            <img src="bufalitaly-tondo-sito.png" alt="Logo Bufalitaly">
            <img src="logo.png" alt="Logo Quattro Portoni">
        </div>

        <h1>Isabelle MUSSY</h1>
        <div class="subtitle">Agent commercial</div>
        <div class="description">Import de fromages italiens d'exception</div>

        <div class="separator-line">
            <div class="dot dot-v"></div>
            <div class="dot dot-w"></div>
            <div class="dot dot-r"></div>
        </div>

        <a href="tel:+33628941135" class="action-link">
            📞 06 28 94 11 35
        </a>

        <a href="mailto:italisa.mussy@gmail.com" class="action-link">
            ✉️ italisa.mussy@gmail.com
        </a>

        <div class="qr-container">
            <img src="qr-code-mini-site.png" alt="QR Code Bufalitaly">
        </div>

        <button class="btn-submit" onclick="telechargerVCard()">
            Enregistrer le contact
        </button>
    </div>

    <script>
        function telechargerVCard() {
            const vcardData = 
                "BEGIN:VCARD\n" +
                "VERSION:3.0\n" +
                "FN:Isabelle MUSSY\n" +
                "ORG:Bufalitaly / Quattro Portoni\n" +
                "TITLE:Agent commercial - Import de fromages italiens d'exception\n" +
                "TEL;TYPE=CELL,VOICE:+33628941135\n" +
                "EMAIL;TYPE=PREF,INTERNET:italisa.mussy@gmail.com\n" +
                "URL:https://ma-carte-contact.vercel.app/\n" +
                "END:VCARD";

            const blob = new Blob([vcardData], { type: "text/vcard;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = "Isabelle_MUSSY.vcf";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>

</body>
</html>
